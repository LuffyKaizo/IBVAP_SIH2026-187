# Render Blueprint for IBVAP — real deployment architecture: two web services + persistent disk.
#
# ARCHITECTURE (matches the live deployment):
#   SERVICE A — IBVAP (EXISTS ALREADY — do NOT recreate and do NOT rename):
#     https://ibvap-uzs5.onrender.com — Express/BFF + built React frontend.
#     Serves /api/* and the static frontend; proxies AI calls to SERVICE B.
#   SERVICE B — ibvap-ai (FastAPI/AI backend): login + screening-login auth,
#     camera registry, MJPEG streams, YOLO metadata, WebSockets, SQLite.
#
# IMPORTANT:
#   * Deploy BOTH services from branch `Siddhesh-Work`. The `main` branch does
#     NOT contain the SQLite production-startup guard fix; a production FastAPI
#     started from `main` aborts with "DATABASE_URL must be PostgreSQL".
#   * AI_SERVICE_URL and VITE_AI_SERVICE_URL are `sync: false`: after SERVICE B
#     is created, copy its ACTUAL assigned onrender.com URL into BOTH vars on
#     SERVICE A in the Render dashboard, then REDeploy SERVICE A — the Vite
#     bundle bakes VITE_AI_SERVICE_URL at BUILD time, so a runtime-only change
#     does not update already-built stream/WebSocket URLs.
#   * SECRET_KEY is `sync: false` on BOTH services: set the SAME value in both
#     env var groups (the BFF verifies JWTs signed by FastAPI).
#   * ADMIN_EMAIL / ADMIN_PASSWORD seed the admin account at FastAPI startup.
#
# DATABASE: SQLite on the persistent disk (no PostgreSQL anywhere). The file
# lives at /var/data/ibvap.db on the disk mounted below; evidence at
# /var/data/evidence. EVIDENCE_DIR must stay an absolute path (production guard).
#
# DEMO MODE: SCREENING_MODE=true (+ VITE_SCREENING_MODE=true on SERVICE A)
# auto-authenticates the admin session so Demo Mode / screening login works
# with no password. This is an explicit, intentional opt-in — delete these
# three values to restore password-only login.

services:
  - type: web
    name: IBVAP
    runtime: node
    plan: starter
    branch: Siddhesh-Work
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_ENV
        value: production
      - key: SECRET_KEY
        sync: false
      - key: AI_SERVICE_URL
        sync: false
      - key: VITE_AI_SERVICE_URL
        sync: false
      - key: SCREENING_MODE
        value: "true"
      - key: VITE_SCREENING_MODE
        value: "true"
      - key: DEV_AUTH_BYPASS
        value: "false"
      - key: GEMINI_API_KEY
        sync: false

  - type: web
    name: ibvap-ai
    runtime: python
    plan: starter
    branch: Siddhesh-Work
    buildCommand: pip install torch --index-url https://download.pytorch.org/whl/cpu && pip install -r backend/ai/requirements.txt
    startCommand: sh scripts/start-fastapi.sh
    healthCheckPath: /health
    disk:
      name: ibvap-evidence
      mountPath: /var/data
      sizeGB: 5
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.11
      - key: APP_ENV
        value: production
      - key: SECRET_KEY
        sync: false
      - key: DATABASE_URL
        value: sqlite+aiosqlite:////var/data/ibvap.db
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: EVIDENCE_DIR
        value: /var/data/evidence
      - key: ALLOWED_ORIGINS
        value: https://ibvap-uzs5.onrender.com
      - key: SCREENING_MODE
        value: "true"
      - key: SYNC_ENABLED
        value: "false"
      - key: BLOCKCHAIN_ENABLED
        value: "false"
