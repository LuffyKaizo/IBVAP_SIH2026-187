# Render Blueprint for IBVAP — two web services and a persistent disk.
#
# Deployment reality (updated):
#   https://ibvap-uzs5.onrender.com  -> the EXISTING BFF service (keep it;
#                                      do NOT recreate it from this file)
#   https://ibvap-ai.onrender.com    -> the FastAPI/AI service this blueprint
#                                      creates (name MUST be `ibvap-ai`: the
#                                      BFF's AI_SERVICE_URL and the built
#                                      frontend's VITE_AI_SERVICE_URL already
#                                      point there)
# ALLOWED_ORIGINS must list exact origins only — no wildcards. It must
# contain the actual BFF origin above.
# SECRET_KEY is `sync: false` on BOTH services: set the SAME value in both
# env var groups (the BFF verifies JWTs signed by FastAPI).
# ADMIN_EMAIL / ADMIN_PASSWORD seed the admin account at FastAPI startup.
#
# DATABASE: SQLite on the persistent disk (no PostgreSQL). The file lives at
# /var/data/ibvap.db on the ibvap-evidence disk mounted below.
#
# DEMO MODE: SCREENING_MODE=true (+ VITE_SCREENING_MODE=true on the BFF)
# auto-authenticates the admin session so Demo Mode / screening login works
# with no password. This is an explicit, intentional opt-in — delete these
# three values to restore password-only login.

services:
  - type: web
    name: ibvap-ai
    runtime: python
    plan: starter
    buildCommand: pip install torch --index-url https://download.pytorch.org/whl/cpu && pip install -r backend/ai/requirements.txt
    startCommand: sh scripts/start-fastapi.sh
    healthCheckPath: /health
    disk:
      name: ibvap-evidence
      mountPath: /var/data
      sizeGB: 5
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.11
      - key: APP_ENV
        value: production
      - key: SECRET_KEY
        sync: false
      - key: DATABASE_URL
        value: sqlite+aiosqlite:////var/data/ibvap.db
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: EVIDENCE_DIR
        value: /var/data/evidence
      - key: ALLOWED_ORIGINS
        value: https://ibvap-uzs5.onrender.com
      - key: SCREENING_MODE
        value: "true"
      - key: SYNC_ENABLED
        value: "false"
      - key: BLOCKCHAIN_ENABLED
        value: "false"

  - type: web
    name: ibvap-bff
    runtime: node
    plan: starter
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_ENV
        value: production
      - key: SECRET_KEY
        sync: false
      - key: AI_SERVICE_URL
        value: https://ibvap-ai.onrender.com
      - key: VITE_AI_SERVICE_URL
        value: https://ibvap-ai.onrender.com
      - key: SCREENING_MODE
        value: "true"
      - key: VITE_SCREENING_MODE
        value: "true"
      - key: DEV_AUTH_BYPASS
        value: "false"
      - key: GEMINI_API_KEY
        sync: false
