# Render Blueprint for IBVAP — two web services, PostgreSQL, persistent evidence disk.
#
# Before first deploy, update these placeholders to your actual service URLs:
#   https://ibvap-ai.onrender.com   -> your FastAPI service URL  (AI_SERVICE_URL,
#                                      VITE_AI_SERVICE_URL, and the BFF origin in ALLOWED_ORIGINS)
#   https://ibvap-bff.onrender.com  -> your BFF service URL      (ALLOWED_ORIGINS on ibvap-ai)
# ALLOWED_ORIGINS must list exact origins only — no wildcards.
# SECRET_KEY is `sync: false` on BOTH services: set the SAME value in both
# env var groups (the BFF verifies JWTs signed by FastAPI).

databases:
  - name: ibvap-db
    plan: starter
    databaseName: ibvap
    user: ibvap

services:
  - type: web
    name: ibvap-ai
    runtime: python
    plan: starter
    buildCommand: pip install torch --index-url https://download.pytorch.org/whl/cpu && pip install -r backend/ai/requirements.txt
    startCommand: sh scripts/start-fastapi.sh
    healthCheckPath: /health
    disk:
      name: ibvap-evidence
      mountPath: /var/data
      sizeGB: 5
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.11
      - key: APP_ENV
        value: production
      - key: SECRET_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: ibvap-db
          property: connectionString
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: EVIDENCE_DIR
        value: /var/data/evidence
      - key: ALLOWED_ORIGINS
        value: https://ibvap-bff.onrender.com
      - key: SCREENING_MODE
        value: "false"
      - key: SYNC_ENABLED
        value: "false"
      - key: BLOCKCHAIN_ENABLED
        value: "false"

  - type: web
    name: ibvap-bff
    runtime: node
    plan: starter
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_ENV
        value: production
      - key: SECRET_KEY
        sync: false
      - key: AI_SERVICE_URL
        value: https://ibvap-ai.onrender.com
      - key: VITE_AI_SERVICE_URL
        value: https://ibvap-ai.onrender.com
      - key: SCREENING_MODE
        value: "false"
      - key: DEV_AUTH_BYPASS
        value: "false"
      - key: GEMINI_API_KEY
        sync: false
